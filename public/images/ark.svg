<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <linearGradient id="ark-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0C"/>
      <stop offset="100%" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="wrap-left" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0E0E0C"/>
      <stop offset="60%" stop-color="#1C1C1A"/>
      <stop offset="100%" stop-color="#141412"/>
    </linearGradient>
    <linearGradient id="wrap-right" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#080807"/>
      <stop offset="60%" stop-color="#161614"/>
      <stop offset="100%" stop-color="#0E0E0C"/>
    </linearGradient>
    <linearGradient id="wrap-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282826"/>
      <stop offset="40%" stop-color="#1E1E1C"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1E1C18" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#ark-bg)"/>
  <!-- Ambient warmth around garment -->
  <rect width="800" height="1100" fill="url(#ambient)"/>

  <!-- ═══════════════════════════════════════════
       THE ARK — wrapped cocoon coat, 3/4 front view
       Heavy, enclosed, vessel-like silhouette
  ═══════════════════════════════════════════ -->

  <!-- Shoulder structure — wide, architectural -->
  <path d="
    M 254,215 L 546,215 L 546,240 L 540,258 L 260,258 L 254,240 Z
  " fill="#202020"/>
  <!-- Shoulder top edge -->
  <line x1="254" y1="215" x2="546" y2="215" stroke="#2E2E2C" stroke-width="1"/>

  <!-- ─── Right outer panel (wraps from behind, viewer's right) ─── -->
  <path d="
    M 546,215
    L 558,260
    L 560,580
    C 558,720 548,860 538,1030
    L 400,1030
    L 400,215
    Z
  " fill="url(#wrap-right)"/>

  <!-- ─── Left outer panel (wraps across front) ─── -->
  <path d="
    M 254,215
    L 242,260
    L 240,580
    C 242,720 252,860 262,1030
    L 400,1030
    L 400,215
    Z
  " fill="url(#wrap-left)"/>

  <!-- ─── Center overlap/wrap — the wrapping panel itself ─── -->
  <path d="
    M 400,215
    L 460,228
    L 490,290
    L 500,480
    C 498,620 488,780 474,1030
    L 328,1030
    C 316,780 308,620 306,480
    L 316,290
    L 346,228
    Z
  " fill="url(#wrap-center)"/>

  <!-- ─── Collar — high, standing, wrapping ─── -->
  <!-- Left collar panel -->
  <path d="
    M 346,228 L 342,195 Q 340,160 354,140
    Q 368,120 390,115 L 400,215 Z
  " fill="#1E1E1C"/>
  <!-- Right collar panel -->
  <path d="
    M 454,228 L 458,195 Q 460,160 446,140
    Q 432,120 410,115 L 400,215 Z
  " fill="#181816"/>
  <!-- Collar meeting point top -->
  <path d="
    M 354,140 Q 376,108 400,106 Q 424,108 446,140
  " fill="none" stroke="#2A2A28" stroke-width="1.2"/>

  <!-- ─── Wrap closure — diagonal fold line across front ─── -->
  <path d="
    M 400,230 C 420,350 435,480 432,640
    C 430,760 424,880 420,1030
  " fill="none" stroke="#0A0A09" stroke-width="1.5" opacity="0.9"/>

  <!-- ─── Horizontal seam lines — barrel/vessel structure ─── -->
  <path d="M 264,420 Q 400,408 536,420" fill="none" stroke="#1A1A18" stroke-width="1" opacity="0.7"/>
  <path d="M 260,600 Q 400,590 540,600" fill="none" stroke="#181818" stroke-width="1" opacity="0.7"/>
  <path d="M 258,780 Q 400,772 542,780" fill="none" stroke="#161616" stroke-width="1" opacity="0.6"/>

  <!-- ─── Left edge highlight (suggesting volume) ─── -->
  <line x1="242" y1="260" x2="262" y2="1030" stroke="#2A2A28" stroke-width="1.5" opacity="0.8"/>
  <!-- Right edge highlight -->
  <line x1="558" y1="260" x2="538" y2="1030" stroke="#222220" stroke-width="1" opacity="0.6"/>

  <!-- ─── Hidden clasp — single fastening point ─── -->
  <rect x="388" y="465" width="24" height="18" fill="#1A1A18" rx="0"/>
  <rect x="394" y="471" width="12" height="6" fill="#111110"/>
  <!-- Clasp bars -->
  <line x1="386" y1="474" x2="414" y2="474" stroke="#252522" stroke-width="0.8"/>

  <!-- ─── Hem, straight and heavy ─── -->
  <line x1="262" y1="1030" x2="538" y2="1030" stroke="#1E1E1C" stroke-width="2"/>

  <!-- ─── Ground shadow (very dark on dark) ─── -->
  <ellipse cx="400" cy="1048" rx="155" ry="7" fill="#040404" opacity="0.9"/>

  <!-- Corner marks — slightly warm white on dark -->
  <rect x="40" y="40" width="28" height="1" fill="#2A2A26" opacity="0.8"/>
  <rect x="40" y="40" width="1" height="28" fill="#2A2A26" opacity="0.8"/>
  <rect x="732" y="40" width="28" height="1" fill="#2A2A26" opacity="0.8"/>
  <rect x="759" y="40" width="1" height="28" fill="#2A2A26" opacity="0.8"/>
  <rect x="40" y="1059" width="28" height="1" fill="#2A2A26" opacity="0.8"/>
  <rect x="40" y="1032" width="1" height="28" fill="#2A2A26" opacity="0.8"/>
  <rect x="732" y="1059" width="28" height="1" fill="#2A2A26" opacity="0.8"/>
  <rect x="759" y="1032" width="1" height="28" fill="#2A2A26" opacity="0.8"/>
</svg>

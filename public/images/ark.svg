<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <linearGradient id="bg-ark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111110"/>
      <stop offset="100%" stop-color="#0A0A09"/>
    </linearGradient>
    <linearGradient id="box-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2824"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
    <linearGradient id="box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3830"/>
      <stop offset="100%" stop-color="#2A2820"/>
    </linearGradient>
    <linearGradient id="box-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141412"/>
      <stop offset="100%" stop-color="#1C1A18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3A3626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#bg-ark)"/>

  <!-- Ambient glow around ark -->
  <rect width="800" height="1100" fill="url(#glow)"/>

  <!-- Subtle horizontal lines (texture) -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1C1C1A" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#1C1C1A" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#1C1C1A" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="900" x2="800" y2="900" stroke="#1C1C1A" stroke-width="0.5" opacity="0.4"/>

  <!-- Ark — 3D box form, isometric perspective -->
  <!-- Top face -->
  <polygon points="240,280 560,280 620,340 180,340" fill="url(#box-top)"/>

  <!-- Front face -->
  <rect x="180" y="340" width="440" height="520" fill="url(#box-face)"/>

  <!-- Right side face -->
  <polygon points="620,340 620,860 560,860 560,340" fill="url(#box-side)"/>

  <!-- Lid overhang line -->
  <line x1="180" y1="340" x2="620" y2="340" stroke="#4A4840" stroke-width="1"/>
  <line x1="240" y1="280" x2="560" y2="280" stroke="#5A5648" stroke-width="1"/>
  <line x1="620" y1="340" x2="560" y2="280" stroke="#4A4840" stroke-width="0.8"/>

  <!-- Front face decorative border -->
  <rect x="200" y="360" width="400" height="480" fill="none" stroke="#302E28" stroke-width="1" opacity="0.8"/>
  <rect x="215" y="375" width="370" height="450" fill="none" stroke="#282624" stroke-width="0.5" opacity="0.6"/>

  <!-- Central lock/clasp -->
  <rect x="386" y="590" width="28" height="20" fill="#3A3830" rx="0"/>
  <rect x="392" y="596" width="16" height="8" fill="#2A2820"/>
  <rect x="395" y="600" width="10" height="10" fill="#1E1C18" rx="10"/>

  <!-- Carrying rings — left -->
  <rect x="220" y="490" width="14" height="40" fill="none" stroke="#3A3830" stroke-width="1.5"/>
  <rect x="214" y="498" width="6" height="24" fill="#2A2820"/>

  <!-- Carrying rings — right -->
  <rect x="566" y="490" width="14" height="40" fill="none" stroke="#3A3830" stroke-width="1.5"/>
  <rect x="580" y="498" width="6" height="24" fill="#2A2820"/>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="870" rx="220" ry="12" fill="#050505" opacity="0.8"/>

  <!-- Corner marks -->
  <rect x="40" y="40" width="30" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="40" y="40" width="1" height="30" fill="#2A2A24" opacity="0.6"/>
  <rect x="730" y="40" width="30" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="759" y="40" width="1" height="30" fill="#2A2A24" opacity="0.6"/>
  <rect x="40" y="1059" width="30" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="40" y="1030" width="1" height="30" fill="#2A2A24" opacity="0.6"/>
  <rect x="730" y="1059" width="30" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="759" y="1030" width="1" height="30" fill="#2A2A24" opacity="0.6"/>
</svg>

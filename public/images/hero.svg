<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A08" stop-opacity="1"/>
      <stop offset="50%" stop-color="#121210" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A08" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="arch-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2A2A26" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A08" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="960" fill="url(#vignette)"/>

  <!-- Far background architectural columns, very subtle -->
  <rect x="160" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="360" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="560" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="760" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="960" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="1160" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>
  <rect x="1360" y="0" width="1" height="960" fill="#1E1E1A" opacity="0.6"/>

  <!-- Primary arch / doorway form -->
  <path d="M640,960 L640,320 Q640,160 800,160 Q960,160 960,320 L960,960" fill="none" stroke="#2E2E28" stroke-width="1.5"/>

  <!-- Inner arch -->
  <path d="M680,960 L680,360 Q680,220 800,220 Q920,220 920,360 L920,960" fill="none" stroke="#242420" stroke-width="1"/>

  <!-- Threshold line -->
  <line x1="560" y1="480" x2="1040" y2="480" stroke="#2A2A24" stroke-width="0.5" opacity="0.8"/>

  <!-- Central column of light — very thin, vertical -->
  <rect x="798" y="0" width="4" height="960" fill="#F5F5F0" opacity="0.04"/>
  <rect x="799" y="0" width="2" height="960" fill="#F5F5F0" opacity="0.06"/>

  <!-- Ground plane lines -->
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#222220" stroke-width="0.5" opacity="0.8"/>
  <line x1="0" y1="840" x2="1600" y2="840" stroke="#1E1E1C" stroke-width="0.5" opacity="0.5"/>

  <!-- Horizon mark -->
  <rect x="750" y="479" width="100" height="1" fill="#3A3A34" opacity="0.9"/>

  <!-- Corner marks, minimal decoration -->
  <rect x="80" y="80" width="40" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="80" y="80" width="1" height="40" fill="#2A2A24" opacity="0.6"/>
  <rect x="1480" y="80" width="40" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="1519" y="80" width="1" height="40" fill="#2A2A24" opacity="0.6"/>
  <rect x="80" y="879" width="40" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="80" y="840" width="1" height="40" fill="#2A2A24" opacity="0.6"/>
  <rect x="1480" y="879" width="40" height="1" fill="#2A2A24" opacity="0.6"/>
  <rect x="1519" y="840" width="1" height="40" fill="#2A2A24" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <linearGradient id="coat-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111110"/>
      <stop offset="100%" stop-color="#1E1E1C"/>
    </linearGradient>
    <linearGradient id="coat-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="100%" stop-color="#0E0E0D"/>
    </linearGradient>
    <linearGradient id="lapel-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252522"/>
      <stop offset="100%" stop-color="#181816"/>
    </linearGradient>
    <linearGradient id="lapel-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#141412"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="#ECEAE5"/>

  <!-- Faint ruled lines — graph paper suggestion -->
  <line x1="0" y1="275" x2="800" y2="275" stroke="#E0DED9" stroke-width="0.5"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#E0DED9" stroke-width="0.5"/>
  <line x1="0" y1="825" x2="800" y2="825" stroke="#E0DED9" stroke-width="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="1038" rx="160" ry="9" fill="#C8C6C0" opacity="0.55"/>

  <!-- ═══════════════════════════════════════════
       COAT BODY — front view, full length
       Left panel (viewer's left = coat's right)
  ═══════════════════════════════════════════ -->
  <path d="
    M 400,205
    L 286,218
    L 272,286
    L 266,1028
    L 400,1028
    Z
  " fill="url(#coat-left)"/>

  <!-- Right panel -->
  <path d="
    M 400,205
    L 514,218
    L 528,286
    L 534,1028
    L 400,1028
    Z
  " fill="url(#coat-right)"/>

  <!-- Center seam / front opening shadow -->
  <line x1="400" y1="440" x2="400" y2="1028" stroke="#0A0A09" stroke-width="1.5" opacity="0.6"/>

  <!-- ─── Shoulder bar ─── -->
  <rect x="266" y="205" width="268" height="20" fill="#1A1A18"/>
  <!-- Shoulder edge highlight -->
  <line x1="266" y1="205" x2="534" y2="205" stroke="#2E2E2C" stroke-width="1"/>

  <!-- ─── Stand collar ─── -->
  <!-- Collar back/base -->
  <path d="
    M 346,205 L 338,170 Q 336,145 352,132 Q 370,118 400,116
    Q 430,118 448,132 Q 464,145 462,170 L 454,205 Z
  " fill="#181816"/>
  <!-- Collar inner fold -->
  <path d="
    M 362,205 L 356,172 Q 355,152 368,142 Q 381,132 400,130
    Q 419,132 432,142 Q 445,152 444,172 L 438,205 Z
  " fill="#222220"/>
  <!-- Collar top edge -->
  <path d="
    M 338,170 Q 336,145 352,132 Q 370,118 400,116
    Q 430,118 448,132 Q 464,145 462,170
  " fill="none" stroke="#2C2C2A" stroke-width="1"/>

  <!-- ─── Left lapel ─── -->
  <path d="
    M 400,205 L 286,218 L 292,250
    L 296,340 L 340,420 L 390,442 L 400,440
    Z
  " fill="url(#lapel-left)"/>
  <!-- Lapel notch -->
  <path d="
    M 296,340 L 332,312 L 360,340
  " fill="none" stroke="#0E0E0C" stroke-width="1"/>
  <!-- Lapel fold line -->
  <line x1="346" y1="205" x2="390" y2="442" stroke="#0C0C0A" stroke-width="0.8" opacity="0.7"/>

  <!-- ─── Right lapel ─── -->
  <path d="
    M 400,205 L 514,218 L 508,250
    L 504,340 L 460,420 L 410,442 L 400,440
    Z
  " fill="url(#lapel-right)"/>
  <!-- Right lapel notch -->
  <path d="
    M 504,340 L 468,312 L 440,340
  " fill="none" stroke="#0A0A09" stroke-width="1"/>
  <!-- Right lapel fold line -->
  <line x1="454" y1="205" x2="410" y2="442" stroke="#0C0C0A" stroke-width="0.8" opacity="0.7"/>

  <!-- ─── Buttons (3 large, centered) ─── -->
  <circle cx="400" cy="510" r="10" fill="#0C0C0A" stroke="#282826" stroke-width="1.5"/>
  <circle cx="400" cy="510" r="4" fill="none" stroke="#1E1E1C" stroke-width="0.8"/>
  <circle cx="400" cy="600" r="10" fill="#0C0C0A" stroke="#282826" stroke-width="1.5"/>
  <circle cx="400" cy="600" r="4" fill="none" stroke="#1E1E1C" stroke-width="0.8"/>
  <circle cx="400" cy="690" r="10" fill="#0C0C0A" stroke="#282826" stroke-width="1.5"/>
  <circle cx="400" cy="690" r="4" fill="none" stroke="#1E1E1C" stroke-width="0.8"/>

  <!-- ─── Pocket welts ─── -->
  <!-- Left pocket -->
  <rect x="284" y="740" width="78" height="7" fill="#141412" rx="0"/>
  <line x1="284" y1="740" x2="362" y2="740" stroke="#202020" stroke-width="0.5"/>
  <!-- Right pocket -->
  <rect x="438" y="740" width="78" height="7" fill="#111110" rx="0"/>
  <line x1="438" y1="740" x2="516" y2="740" stroke="#1E1E1C" stroke-width="0.5"/>

  <!-- ─── Side seams ─── -->
  <line x1="310" y1="360" x2="288" y2="1028" stroke="#0E0E0C" stroke-width="0.7" opacity="0.5"/>
  <line x1="490" y1="360" x2="512" y2="1028" stroke="#0C0C0A" stroke-width="0.7" opacity="0.5"/>

  <!-- ─── Hem ─── -->
  <line x1="266" y1="1028" x2="534" y2="1028" stroke="#0E0E0C" stroke-width="1.5"/>

  <!-- ─── Back vent hint ─── -->
  <line x1="400" y1="880" x2="400" y2="1028" stroke="#0A0A09" stroke-width="1" opacity="0.8"/>

  <!-- Corner registration marks -->
  <rect x="40" y="40" width="28" height="1" fill="#C4C2BC" opacity="0.7"/>
  <rect x="40" y="40" width="1" height="28" fill="#C4C2BC" opacity="0.7"/>
  <rect x="732" y="40" width="28" height="1" fill="#C4C2BC" opacity="0.7"/>
  <rect x="759" y="40" width="1" height="28" fill="#C4C2BC" opacity="0.7"/>
  <rect x="40" y="1059" width="28" height="1" fill="#C4C2BC" opacity="0.7"/>
  <rect x="40" y="1032" width="1" height="28" fill="#C4C2BC" opacity="0.7"/>
  <rect x="732" y="1059" width="28" height="1" fill="#C4C2BC" opacity="0.7"/>
  <rect x="759" y="1032" width="1" height="28" fill="#C4C2BC" opacity="0.7"/>
</svg>

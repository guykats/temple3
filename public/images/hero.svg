<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080807"/>
      <stop offset="100%" stop-color="#111110"/>
    </linearGradient>
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141412"/>
      <stop offset="100%" stop-color="#0A0A09"/>
    </linearGradient>
    <linearGradient id="gate-glow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1E1C16" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A0A08" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillar-left-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0A08"/>
      <stop offset="40%" stop-color="#1A1A16"/>
      <stop offset="100%" stop-color="#0E0E0C"/>
    </linearGradient>
    <linearGradient id="pillar-right-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E0E0C"/>
      <stop offset="60%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#0A0A08"/>
    </linearGradient>
    <linearGradient id="arch-fill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0A"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>
    <radialGradient id="threshold-light" cx="50%" cy="62%" r="22%">
      <stop offset="0%" stop-color="#2A2820" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══ SKY / BACKGROUND ═══ -->
  <rect width="1600" height="960" fill="url(#sky)"/>

  <!-- Distant wall texture — subtle horizontal lines -->
  <line x1="0" y1="180" x2="1600" y2="180" stroke="#111110" stroke-width="0.8" opacity="0.6"/>
  <line x1="0" y1="260" x2="1600" y2="260" stroke="#111110" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="340" x2="1600" y2="340" stroke="#0E0E0D" stroke-width="0.8" opacity="0.4"/>
  <line x1="0" y1="420" x2="1600" y2="420" stroke="#0E0E0D" stroke-width="0.6" opacity="0.4"/>

  <!-- ═══ FLOOR PLANE ═══ -->
  <rect x="0" y="740" width="1600" height="220" fill="url(#floor-grad)"/>
  <!-- Floor seam lines (perspective) -->
  <line x1="0" y1="740" x2="1600" y2="740" stroke="#1A1A18" stroke-width="1"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#141412" stroke-width="0.6" opacity="0.5"/>
  <line x1="0" y1="860" x2="1600" y2="860" stroke="#111110" stroke-width="0.6" opacity="0.4"/>

  <!-- Floor perspective lines converging to vanishing point (800, 480) -->
  <line x1="0" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.5" opacity="0.3"/>
  <line x1="400" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.4" opacity="0.25"/>
  <line x1="600" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.4" opacity="0.2"/>
  <line x1="1000" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.4" opacity="0.2"/>
  <line x1="1200" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.4" opacity="0.25"/>
  <line x1="1400" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.5" opacity="0.3"/>
  <line x1="1600" y1="960" x2="800" y2="480" stroke="#181816" stroke-width="0.5" opacity="0.3"/>

  <!-- ═══ SECONDARY BACKGROUND COLUMNS (far, very dark) ═══ -->
  <rect x="130" y="80" width="28" height="660" fill="#0D0D0B"/>
  <rect x="320" y="80" width="28" height="660" fill="#0D0D0B"/>
  <rect x="1252" y="80" width="28" height="660" fill="#0D0D0B"/>
  <rect x="1442" y="80" width="28" height="660" fill="#0D0D0B"/>

  <!-- Far column capitals -->
  <rect x="122" y="74" width="44" height="14" fill="#0F0F0D"/>
  <rect x="312" y="74" width="44" height="14" fill="#0F0F0D"/>
  <rect x="1244" y="74" width="44" height="14" fill="#0F0F0D"/>
  <rect x="1434" y="74" width="44" height="14" fill="#0F0F0D"/>

  <!-- ═══ PRIMARY GATE / ARCH STRUCTURE ═══ -->

  <!-- Gate threshold glow (light from beyond) -->
  <rect x="590" y="160" width="420" height="580" fill="url(#gate-glow)"/>
  <rect x="590" y="160" width="420" height="580" fill="url(#threshold-light)"/>

  <!-- ─── LEFT MAIN PILLAR ─── -->
  <!-- Pillar base (plinth) -->
  <rect x="530" y="720" width="120" height="30" fill="#181816"/>
  <rect x="540" y="710" width="100" height="14" fill="#1A1A18"/>
  <!-- Pillar shaft -->
  <rect x="556" y="160" width="68" height="552" fill="url(#pillar-left-grad)"/>
  <!-- Fluting lines on left pillar -->
  <line x1="566" y1="160" x2="566" y2="712" stroke="#0A0A09" stroke-width="0.7" opacity="0.6"/>
  <line x1="576" y1="160" x2="576" y2="712" stroke="#131311" stroke-width="0.5" opacity="0.5"/>
  <line x1="586" y1="160" x2="586" y2="712" stroke="#0E0E0C" stroke-width="0.5" opacity="0.4"/>
  <line x1="596" y1="160" x2="596" y2="712" stroke="#0A0A09" stroke-width="0.7" opacity="0.5"/>
  <!-- Pillar capital -->
  <rect x="540" y="148" width="100" height="18" fill="#1E1E1C"/>
  <rect x="532" y="136" width="116" height="16" fill="#1A1A18"/>
  <rect x="528" y="124" width="124" height="16" fill="#161614"/>
  <rect x="520" y="112" width="140" height="16" fill="#1C1C1A"/>
  <!-- Capital ovolo profile -->
  <rect x="516" y="100" width="148" height="14" fill="#181816"/>
  <line x1="516" y1="100" x2="664" y2="100" stroke="#222220" stroke-width="1"/>

  <!-- ─── RIGHT MAIN PILLAR ─── -->
  <!-- Pillar base -->
  <rect x="950" y="720" width="120" height="30" fill="#181816"/>
  <rect x="960" y="710" width="100" height="14" fill="#1A1A18"/>
  <!-- Pillar shaft -->
  <rect x="976" y="160" width="68" height="552" fill="url(#pillar-right-grad)"/>
  <!-- Fluting lines on right pillar -->
  <line x1="986" y1="160" x2="986" y2="712" stroke="#0A0A09" stroke-width="0.7" opacity="0.5"/>
  <line x1="998" y1="160" x2="998" y2="712" stroke="#0E0E0C" stroke-width="0.5" opacity="0.4"/>
  <line x1="1010" y1="160" x2="1010" y2="712" stroke="#131311" stroke-width="0.5" opacity="0.5"/>
  <line x1="1022" y1="160" x2="1022" y2="712" stroke="#0A0A09" stroke-width="0.7" opacity="0.6"/>
  <!-- Pillar capital -->
  <rect x="960" y="148" width="100" height="18" fill="#1E1E1C"/>
  <rect x="952" y="136" width="116" height="16" fill="#1A1A18"/>
  <rect x="948" y="124" width="124" height="16" fill="#161614"/>
  <rect x="940" y="112" width="140" height="16" fill="#1C1C1A"/>
  <rect x="936" y="100" width="148" height="14" fill="#181816"/>
  <line x1="936" y1="100" x2="1084" y2="100" stroke="#222220" stroke-width="1"/>

  <!-- ─── ENTABLATURE (lintel across the top) ─── -->
  <rect x="516" y="76" width="568" height="28" fill="#161614"/>
  <rect x="510" y="60" width="580" height="20" fill="#1A1A18"/>
  <rect x="504" y="48" width="592" height="16" fill="#141412"/>
  <line x1="504" y1="48" x2="1096" y2="48" stroke="#222220" stroke-width="1.2"/>

  <!-- ─── ARCH — pointed arch spanning between pillars ─── -->
  <!-- The arch void / opening -->
  <path d="
    M 624,712 L 624,360
    Q 624,160 800,140
    Q 976,160 976,360
    L 976,712
    Z
  " fill="url(#arch-fill)"/>

  <!-- Arch outer curve -->
  <path d="
    M 624,360 Q 624,148 800,130 Q 976,148 976,360
  " fill="none" stroke="#1E1E1C" stroke-width="2"/>

  <!-- Arch inner curve (reveals depth) -->
  <path d="
    M 636,370 Q 636,164 800,148 Q 964,164 964,370
  " fill="none" stroke="#161614" stroke-width="1" opacity="0.7"/>

  <!-- Arch keystone -->
  <polygon points="790,130 810,130 816,160 784,160" fill="#1A1A18"/>
  <line x1="800" y1="130" x2="800" y2="158" stroke="#222220" stroke-width="0.8"/>

  <!-- ─── FRIEZE / ENTABLATURE DECORATION ─── -->
  <!-- Triglyphs -->
  <rect x="556" y="60" width="18" height="20" fill="#111110"/>
  <rect x="636" y="60" width="18" height="20" fill="#111110"/>
  <rect x="716" y="60" width="18" height="20" fill="#111110"/>
  <rect x="866" y="60" width="18" height="20" fill="#111110"/>
  <rect x="946" y="60" width="18" height="20" fill="#111110"/>
  <rect x="1026" y="60" width="18" height="20" fill="#111110"/>

  <!-- ═══ FIGURE — standing in the threshold (minimal silhouette) ═══ -->
  <!-- A lone standing figure, just inside the gate -->
  <!-- Head -->
  <ellipse cx="800" cy="390" rx="16" ry="20" fill="#0E0E0C"/>
  <!-- Neck -->
  <rect x="795" y="408" width="10" height="16" fill="#0D0D0B"/>
  <!-- Shoulders -->
  <path d="M 758,424 Q 800,418 842,424 L 838,448 Q 800,442 762,448 Z" fill="#0E0E0C"/>
  <!-- Coat body (long, column-like — THE PILLAR) -->
  <path d="
    M 762,448
    L 756,660
    L 750,730
    L 850,730
    L 844,660
    L 838,448
    Q 800,442 762,448
    Z
  " fill="#0C0C0A"/>
  <!-- Coat edge line (slight highlight, figure has volume) -->
  <line x1="756" y1="448" x2="750" y2="730" stroke="#141412" stroke-width="0.8"/>
  <line x1="844" y1="448" x2="850" y2="730" stroke="#111110" stroke-width="0.8"/>

  <!-- ═══ THRESHOLD MARKER ═══ -->
  <!-- Horizontal line at eye level -->
  <line x1="624" y1="480" x2="976" y2="480" stroke="#1E1E1C" stroke-width="0.6" opacity="0.5"/>
  <!-- Center vertical (axis mundi) -->
  <line x1="800" y1="128" x2="800" y2="740" stroke="#1C1C18" stroke-width="0.5" opacity="0.3"/>

  <!-- ═══ OUTER FRAME BORDER ═══ -->
  <rect x="40" y="40" width="1520" height="880" fill="none" stroke="#181816" stroke-width="1" opacity="0.5"/>
  <!-- Corner registration marks -->
  <rect x="40" y="40" width="36" height="1.2" fill="#222220" opacity="0.8"/>
  <rect x="40" y="40" width="1.2" height="36" fill="#222220" opacity="0.8"/>
  <rect x="1524" y="40" width="36" height="1.2" fill="#222220" opacity="0.8"/>
  <rect x="1559" y="40" width="1.2" height="36" fill="#222220" opacity="0.8"/>
  <rect x="40" y="919" width="36" height="1.2" fill="#222220" opacity="0.8"/>
  <rect x="40" y="883" width="1.2" height="36" fill="#222220" opacity="0.8"/>
  <rect x="1524" y="919" width="36" height="1.2" fill="#222220" opacity="0.8"/>
  <rect x="1559" y="883" width="1.2" height="36" fill="#222220" opacity="0.8"/>
</svg>
